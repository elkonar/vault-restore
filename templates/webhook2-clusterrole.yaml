{{- template "vault.webhook2_cleanerEnabled" . -}}
{{- if .webhook2_cleanerEnabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "vault.fullname" . }}-webhook2-cleaner-clusterrole
  labels:
    app.kubernetes.io/name: {{ include "vault.name" . }}-webhook2-cleaner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: ["", "admissionregistration.k8s.io"] # was originally ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "pods"] # added pods
  verbs:
    - "get"
    - "list"
    - "watch"
    - "patch"
    - "delete" #added
{{- if and (eq (.Values.injector.leaderElector.enabled | toString) "true") (gt (.Values.injector.replicas | int) 1) }}
- apiGroups: [""]
  resources: ["nodes"]
  verbs:
    - "get"
{{ end }}
{{ end }}